  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <g filter="url(#lift)">
    <path d="M282 690 V340 L432 525 L582 340 V690" fill="none" stroke="url(#ink)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="712" y="286" width="28" height="468" rx="14" fill="#a594f9"/>
